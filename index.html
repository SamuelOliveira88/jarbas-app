<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jarbas</title>
<meta name="theme-color" content="#0e5a4d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jarbas">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* Layout: uma tela de conversa, cabeçalho fixo, mensagens rolando, campo de envio colado embaixo */
:root{
  --bg:#eef2f0; --panel:#ffffff; --ink:#13201c; --muted:#5d6f69; --line:#d6dfdb;
  --accent:#0e6b5c; --accent-ink:#ffffff; --mine:#0e6b5c; --mine-ink:#ffffff;
  --bubble:#ffffff; --chip:#e1ebe7; --warn:#a4570b; --danger:#b3261e;
  --font:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --display:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1512; --panel:#14211d; --ink:#e7f0ec; --muted:#8fa49d; --line:#243630;
  --accent:#3fb89f; --accent-ink:#06211b; --mine:#1c6f5f; --mine-ink:#f2fbf8;
  --bubble:#1a2a25; --chip:#223530; --warn:#e0a35c; --danger:#ff8a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1512; --panel:#14211d; --ink:#e7f0ec; --muted:#8fa49d; --line:#243630;
  --accent:#3fb89f; --accent-ink:#06211b; --mine:#1c6f5f; --mine-ink:#f2fbf8;
  --bubble:#1a2a25; --chip:#223530; --warn:#e0a35c; --danger:#ff8a80; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--font);-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
#app{height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto;background:var(--bg)}
header{display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:var(--panel);border-bottom:1px solid var(--line)}
.logo{width:38px;height:38px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 20px var(--display)}
.title{flex:1;min-width:0}
.title b{display:block;font:700 18px/1.1 var(--display);letter-spacing:-.01em}
.title span{font-size:13px;color:var(--muted)}
.title span i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:6px}
.title span.off i{background:var(--danger)}
.ghost{background:none;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px;color:var(--muted);cursor:pointer}
#feed{flex:1;overflow-y:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain}
.empty{margin:auto;text-align:center;color:var(--muted);max-width:30ch}
.empty b{display:block;color:var(--ink);font:700 18px var(--display);margin-bottom:6px}
.msg{max-width:min(88%,560px);min-width:0}
.msg .b{padding:10px 13px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bubble);border:1px solid var(--line);border-top-left-radius:6px}
.msg .t{font-size:12px;color:var(--muted);margin:3px 6px 0}
.msg.me{align-self:flex-end}
.msg.me .b{background:var(--mine);color:var(--mine-ink);border-color:transparent;border-top-left-radius:16px;border-top-right-radius:6px}
.msg.me .t{text-align:right}
.msg.pick{align-self:flex-end}
.msg.pick .b{background:var(--chip);color:var(--ink);border-color:var(--line);border-radius:999px;padding:6px 14px;font-size:14px}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.opt{border:1.5px solid var(--accent);background:transparent;color:var(--accent);border-radius:12px;padding:10px 14px;font-weight:600;font-size:15px;cursor:pointer;min-height:44px}
.opt:active{background:var(--accent);color:var(--accent-ink)}
.opt[disabled]{opacity:.45;cursor:default;border-color:var(--line);color:var(--muted)}
.opt.done{opacity:1;background:var(--chip);border-color:var(--chip);color:var(--ink)}
.typing{align-self:flex-start;color:var(--muted);font-size:14px;padding:2px 6px}
.typing span{display:inline-block;animation:bl 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,60%,100%{opacity:.25}30%{opacity:1}}
@media (prefers-reduced-motion:reduce){.typing span{animation:none}}
footer{padding:8px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));background:var(--panel);border-top:1px solid var(--line)}
.chips{display:flex;gap:8px;margin-bottom:8px;overflow-x:auto}
.chip{flex:none;border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
form{display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;min-width:0;resize:none;max-height:140px;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:11px 13px;line-height:1.35}
textarea:focus,input:focus,.opt:focus-visible,.chip:focus-visible,.ghost:focus-visible,.send:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.send{border:0;background:var(--accent);color:var(--accent-ink);border-radius:14px;width:48px;height:46px;font-size:20px;font-weight:700;cursor:pointer}
.send[disabled]{opacity:.5}
.err{color:var(--danger);font-size:13px;padding:0 4px 6px}
#login{height:100%;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
#login form{display:flex;flex-direction:column;align-items:stretch;gap:12px;width:min(380px,100%);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px}
#login h1{font:700 26px var(--display);margin:0;letter-spacing:-.02em}
#login p{margin:0;color:var(--muted);font-size:14px}
#login label{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
#login input{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;color:var(--ink);font-size:16px}
#login .go{border:0;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:13px;font-weight:700;cursor:pointer;min-height:46px}
</style>
</head>
<body>
<div id="login" hidden>
  <form id="loginForm">
    <div class="logo">J</div>
    <h1>Jarbas</h1>
    <p>Entre com o login que você criou no Supabase.</p>
    <label for="em">E-mail<input id="em" type="email" autocomplete="username" required></label>
    <label for="pw">Senha<input id="pw" type="password" autocomplete="current-password" required></label>
    <div class="err" id="loginErr" hidden></div>
    <button class="go" type="submit" id="loginBtn">Entrar</button>
  </form>
</div>

<div id="app" hidden>
  <header>
    <div class="logo">J</div>
    <div class="title"><b>Jarbas</b><span id="status"><i></i>Conectado</span></div>
    <button class="ghost" id="logout" type="button">Sair</button>
  </header>
  <main id="feed" aria-live="polite"></main>
  <footer>
    <div class="chips"><button class="chip" type="button" data-cmd="/ajuda">/ajuda</button></div>
    <div class="err" id="sendErr" hidden></div>
    <form id="sendForm">
      <textarea id="txt" rows="1" placeholder="Escreva para o Jarbas" aria-label="Mensagem"></textarea>
      <button class="send" type="submit" id="sendBtn" aria-label="Enviar">➤</button>
    </form>
  </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://peypojjxtaigrqembbqo.supabase.co";
const SUPABASE_KEY = "sb_publishable_xSyyR0E9h7uY2RMc4m7Zgw_TvhYX390"; // chave pública, feita para ficar no navegador
const CORRETOR = "samuel";
const EMAIL = "samuelrodrigodeoliveira@gmail.com";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {auth:{persistSession:true,autoRefreshToken:true}});

const $ = id => document.getElementById(id);
const LABELS = {
  alerta: ["✅ ASSUMO", "📞 LIGAR DEPOIS", "🚫 IGNORAR"],
  posvisita: ["😍 Gostou", "🤔 Vai pensar", "😕 Não gostou", "📝 Vai fazer proposta"],
  simnao: ["Sim", "Não"]
};
let timer = null, rows = [], waitingSince = 0, lastSig = "", busy = false;

function show(which){ $("login").hidden = which !== "login"; $("app").hidden = which !== "app"; }
function hhmm(iso){ try{ return new Date(iso).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}); }catch(e){ return ""; } }
function setStatus(ok){ const s=$("status"); s.className = ok ? "" : "off"; s.innerHTML = "<i></i>" + (ok ? "Conectado" : "Sem conexão"); }

async function load(){
  if (busy) return; busy = true;
  try{
    const [a,b] = await Promise.all([
      sb.from("jarbas_app_msgs").select("id,texto,tipo,criado_em").order("criado_em",{ascending:false}).limit(60),
      sb.from("jarbas_app_saida").select("id,texto,tipo,botoes,criado_em").order("criado_em",{ascending:false}).limit(60)
    ]);
    if (a.error || b.error) throw (a.error || b.error);
    setStatus(true);
    const mine = a.data.map(r => ({k:"m"+r.id, who:"me", ...r}));
    const bot = b.data.map(r => ({k:"s"+r.id, who:"bot", ...r}));
    const all = mine.concat(bot).sort((x,y) => new Date(x.criado_em) - new Date(y.criado_em) || (x.who==="me"?-1:1));
    if (bot.length && waitingSince && bot.some(r => new Date(r.criado_em).getTime() >= waitingSince)) waitingSince = 0;
    if (waitingSince && Date.now() - waitingSince > 120000) waitingSince = 0;
    const sig = all.map(r => r.k).join(",") + "|" + !!waitingSince;
    rows = all;
    if (sig !== lastSig){ lastSig = sig; render(); }
  }catch(e){
    setStatus(false);
    if (e && /JWT|auth|401|403/i.test(String(e.message||e.code))) { await sb.auth.signOut(); }
  }finally{ busy = false; }
}

function render(){
  const feed = $("feed");
  const nearBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 140;
  feed.innerHTML = "";
  if (!rows.length){
    feed.innerHTML = '<div class="empty"><b>Nada por aqui ainda</b>Escreva uma mensagem, como "marca a Maria quinta às 15h no Laguna", ou toque em /ajuda.</div>';
  }
  const picks = rows.filter(r => r.who==="me" && r.tipo==="botao");
  rows.forEach(r => {
    if (r.who === "me" && r.tipo === "botao"){
      const lab = labelFor(r.texto) || "Resposta enviada";
      feed.append(el("div","msg pick",'<div class="b"></div><div class="t"></div>',lab,hhmm(r.criado_em)));
      return;
    }
    const box = el("div","msg " + (r.who==="me"?"me":""),'<div class="b"></div><div class="t"></div>',r.texto||"",hhmm(r.criado_em));
    if (r.who==="bot"){
      const bt = r.botoes || {};
      const cb = Array.isArray(bt.cb) ? bt.cb : [];
      if (cb.length && LABELS[bt.teclado]){
        const when = new Date(r.criado_em).getTime();
        const chosen = picks.find(p => cb.includes(p.texto) && new Date(p.criado_em).getTime() >= when - 2000);
        const wrap = document.createElement("div"); wrap.className = "opts";
        cb.forEach((c,i) => {
          const b = document.createElement("button"); b.type="button"; b.className="opt";
          b.textContent = bt.teclado==="simnao" ? (i===0 ? (bt.label_sim||"Sim") : (bt.label_nao||"Não")) : (LABELS[bt.teclado][i] || ("Opção " + (i+1)));
          if (chosen){ b.disabled = true; if (chosen.texto === c) b.classList.add("done"); }
          else b.onclick = () => pick(c, b);
          wrap.append(b);
        });
        box.querySelector(".b").after(wrap);
      }
    }
    feed.append(box);
  });
  if (waitingSince){ const t = el("div","typing","Jarbas está respondendo <span>•</span><span>•</span><span>•</span>"); t.innerHTML = "Jarbas está respondendo <span>•</span><span>•</span><span>•</span>"; feed.append(t); }
  if (nearBottom || lastSig.length < 6) feed.scrollTop = feed.scrollHeight;
}
function el(tag, cls, html, a, b){ const n = document.createElement(tag); n.className = cls; n.innerHTML = html; if (a !== undefined){ n.querySelector(".b").textContent = a; n.querySelector(".t").textContent = b || ""; } return n; }
function labelFor(cb){
  for (const r of rows){ if (r.who!=="bot") continue; const bt = r.botoes||{}; const i = (bt.cb||[]).indexOf(cb); if (i>=0 && LABELS[bt.teclado]) return bt.teclado==="simnao" ? (i===0?(bt.label_sim||"Sim"):(bt.label_nao||"Não")) : LABELS[bt.teclado][i]; }
  return "";
}

async function send(texto, tipo){
  const err = $("sendErr"); err.hidden = true;
  const { error } = await sb.from("jarbas_app_msgs").insert({ corretor_id: CORRETOR, texto, tipo });
  if (error){ err.textContent = "Não consegui enviar. Confira a conexão e tente de novo."; err.hidden = false; return false; }
  waitingSince = Date.now(); lastSig = ""; await load(); return true;
}
async function pick(cb, btn){ btn.disabled = true; const ok = await send(cb, "botao"); if (!ok) btn.disabled = false; }

$("sendForm").addEventListener("submit", async e => {
  e.preventDefault();
  const v = $("txt").value.trim(); if (!v) return;
  $("sendBtn").disabled = true;
  const ok = await send(v, "texto");
  $("sendBtn").disabled = false;
  if (ok){ $("txt").value = ""; $("txt").style.height = "auto"; }
});
$("txt").addEventListener("input", e => { e.target.style.height = "auto"; e.target.style.height = Math.min(e.target.scrollHeight,140) + "px"; });
$("txt").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && window.matchMedia("(hover:hover)").matches){ e.preventDefault(); $("sendForm").requestSubmit(); } });
document.querySelectorAll(".chip").forEach(c => c.onclick = () => send(c.dataset.cmd, "texto"));
$("logout").onclick = () => sb.auth.signOut();

$("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  const err = $("loginErr"); err.hidden = true; $("loginBtn").disabled = true;
  const { error } = await sb.auth.signInWithPassword({ email: $("em").value.trim(), password: $("pw").value });
  $("loginBtn").disabled = false;
  if (error){ err.textContent = "E-mail ou senha incorretos."; err.hidden = false; }
});

function start(){ show("app"); lastSig = ""; load(); clearInterval(timer); timer = setInterval(() => { if (!document.hidden) load(); }, 3000); }
function stop(){ clearInterval(timer); rows = []; lastSig = ""; show("login"); $("pw").value = ""; }
document.addEventListener("visibilitychange", () => { if (!document.hidden && !$("app").hidden) load(); });

$("em").value = EMAIL;
sb.auth.onAuthStateChange((ev, session) => { if (session) start(); else stop(); });
sb.auth.getSession().then(({data}) => { if (!data.session) show("login"); });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
